<!DOCTYPE html>
<html lang="es" id="html-doc">
<head id="head-doc">
    <meta charset="UTF-8" id="meta-charset">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" id="meta-viewport">
    <title id="titulo-pagina">Formulario</title>
    <link rel="stylesheet" href="CSS/styles.css" id="estilos-css">
</head>
<body id="cuerpo-pagina">
    <div>
        <header id="cabecera-principal">
            <h1 id="titulo-principal">FORMULARIO</h1>
        </header>
    </div>

    <main id="contenido-principal">
        <div>
            <form id="formulario-registro" action="#">
            
                <!-- DATOS PERSONALES -->
                <div id="grupo-nombre" class="form-group">
                    <label id="label-nombre" for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                </div>

                <div id="grupo-apellido" class="form-group">
                    <label id="label-apellido" for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Apellidos" required>
                </div>

                <div id="grupo-tipo-identificacion" class="form-group">
                    <label id="label-tipo-identificacion" for="tipo_identificacion">Tipo de identificación:</label>
                    <select id="tipo_identificacion" name="tipo_identificacion" required>
                        <option value="" disabled selected>Seleccione...</option>
                        <option id="opcion-cc" value="13">Cédula de ciudadanía</option>
                        <option id="opcion-ti" value="12">Tarjeta de identidad</option>
                        <option id="opcion-ce" value="21">Cédula de extranjería</option>
                        <option id="opcion-pe" value="41">Pasaporte</option>
                    </select>
                </div>

                <div id="grupo-num-identificacion" class="form-group">
                    <label id="label-num-identificacion" for="numero_identificacion">Número de identificación:</label>
                    <input type="text" id="numero_identificacion" name="numero_identificacion" placeholder="Su número de identificación" required>
                </div>

                <div id="grupo-nacimiento" class="form-group">
                    <label id="label-nacimiento" for="nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="nacimiento" name="nacimiento" required>
                </div>

                <div id="grupo-celular" class="form-group">
                    <label id="label-celular" for="celular">Número de celular:</label>
                    <input type="tel" id="celular" name="celular" placeholder="Su número de celular" required>
                </div>

                <div id="grupo-correo" class="form-group">
                    <label id="label-correo" for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Su correo electrónico" required>
                </div>

                <div id="grupo-pais" class="form-group">
                    <label id="label-pais" for="pais">País de domicilio:</label>
                    <select id="pais" name="pais" required>
                        <option value="1" disabled>Seleccione un país...</option>
                        <option value="169" selected>Colombia</option>
                        <option value="249">Estados Unidos</option>
                        <option value="245">España</option>
                    </select>
                </div>

                <div id="grupo-ciudad" class="form-group">
                    <label id="label-ciudad" for="ciudad">Ciudad de domicilio:</label>
                    <select id="ciudad" name="ciudad" required>
                        <option value="1" disabled selected>Seleccione una ciudad...</option>
                        
                        <optgroup label="Colombia">
                            <option value="11001">Bogotá, D.C.</option>
                            <option value="05001">Medellín</option>
                            <option value="76001">Cali</option>
                            <option value="08001">Barranquilla</option>
                            <option value="13001">Cartagena</option>
                        </optgroup>
                        
                        <optgroup label="Estados Unidos">
                            <option value="US-NY">Nueva York</option>
                            <option value="US-MI">Miami</option>
                            <option value="US-LA">Los Ángeles</option>
                            <option value="US-CH">Chicago</option>
                            <option value="US-HO">Houston</option>
                        </optgroup>

                        <optgroup label="España">
                            <option value="ES-MA">Madrid</option>
                            <option value="ES-BA">Barcelona</option>
                            <option value="ES-VA">Valencia</option>
                            <option value="ES-SE">Sevilla</option>
                            <option value="ES-BI">Bilbao</option>
                        </optgroup>
                    </select>
                </div>
                <fieldset id="grupo-retos-interpolacion" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px;">
                    <legend style="font-weight: bold; padding: 0 5px;">Parámetros para Retos de Interpolación</legend>

                    <div id="grupo-version-app" class="form-group">
                        <label id="label-version-app" for="version_app">Versión del Sistema (Reto 1):</label>
                        <input type="text" id="version_app" name="version_app" value="1.0" required>
                    </div>

                    <div id="grupo-nombre-curso" class="form-group">
                        <label id="label-nombre-curso" for="nombre_curso">Nombre del Curso (Reto 3):</label>
                        <input type="text" id="nombre_curso" name="nombre_curso" value="Análisis y Desarrollo de Software" required>
                    </div>

                    <div id="grupo-precio-item" class="form-group">
                        <label id="label-precio-item" for="precio_item">Precio Unitario (Reto 4):</label>
                        <input type="number" id="precio_item" name="precio_item" value="50000" required>
                    </div>

                    <div id="grupo-cantidad-item" class="form-group">
                        <label id="label-cantidad-item" for="cantidad_item">Cantidad (Reto 4):</label>
                        <input type="number" id="cantidad_item" name="cantidad_item" value="2" required>
                    </div>

                    <div id="grupo-item-nota1" class="form-group">
                        <label id="label-item-nota1" for="item_nota1">Ítem de Nota 1 (Reto 6):</label>
                        <input type="text" id="item_nota1" name="item_nota1" value="Registro completado" required>
                    </div>

                    <div id="grupo-item-nota2" class="form-group">
                        <label id="label-item-nota2" for="item_nota2">Ítem de Nota 2 (Reto 6):</label>
                        <input type="text" id="item_nota2" name="item_nota2" value="Datos guardados en localStorage" required>
                    </div>
                </fieldset>
        
                <!-- TRATAMIENTO DE DATOS Y ENVÍO -->
                <div id="grupo-tratamiento-datos" class="form-group" style="margin-top: 20px;">
                    <h4 id="titulo-tratamiento">Tratamiento de datos personales</h4>
                    <a id="enlace-terminos" href="https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=49981" target="_blank">Términos y condiciones</a>
                
                    <div id="grupo-checkbox">
                        <input type="checkbox" id="tratamiento_datos" name="tratamiento_datos" required>
                        <label id="label-tratamiento" for="tratamiento_datos">Acepto el tratamiento de mis datos personales</label>
                    </div>
                </div>

                <div id="grupo-boton-enviar" class="form-group">
                    <button type="submit" class="btn-submit">Enviar</button>
                </div>

            </form>
        </div>
        
    </main>
    <script src="JS/script.js"></script>
</body>
</html>
